<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freedom Protocol - Health Coach</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Auth Screens */
        .auth-container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .toggle-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .error {
            color: #ef4444;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        .success {
            color: #10b981;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        /* App Layout */
        .app {
            background: white;
            border-radius: 20px;
            padding: 30px;
            min-height: 80vh;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .app-header h1 {
            font-size: 28px;
            color: #667eea;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .btn-logout {
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }

        .card {
            background: #f9f9f9;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .card h3 {
            margin-bottom: 20px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            font-weight: 600;
            color: #667eea;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Section -->
    <div id="authSection" class="auth-container">
        <div class="logo">
            <h1>🏃‍♂️ Freedom Protocol</h1>
            <p>Your AI-Powered Health Coach</p>
        </div>

        <!-- Login Form -->
        <div id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password">
            </div>
            <button class="btn" onclick="login()">Sign In</button>
            <div class="toggle-link">
                Don't have an account? <a href="#" onclick="showSignup()">Sign Up</a>
            </div>
            <div id="loginError" class="error"></div>
        </div>

        <!-- Signup Form -->
        <div id="signupForm" class="hidden">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Phone (optional)</label>
                <input type="tel" id="signupPhone" placeholder="+233 XXX XXX XXX">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Create password">
            </div>
            <button class="btn" onclick="signup()">Create Account</button>
            <div class="toggle-link">
                Already have an account? <a href="#" onclick="showLogin()">Sign In</a>
            </div>
            <div id="signupError" class="error"></div>
        </div>
    </div>

    <!-- App Section -->
    <div id="appSection" class="container hidden">
        <div class="app">
            <div class="app-header">
                <h1>Freedom Protocol</h1>
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span id="userName">User</span>
                    <button class="btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="showTab('dashboard')">📊 Dashboard</button>
                <button class="tab" onclick="showTab('glucose')">📈 Log Glucose</button>
                <button class="tab" onclick="showTab('profile')">👤 Profile</button>
            </div>

            <!-- Dashboard Tab -->
            <div id="dashboardTab" class="tab-content active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Readings</div>
                        <div class="stat-value" id="totalReadings">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Average Glucose</div>
                        <div class="stat-value" id="avgGlucose">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Latest Reading</div>
                        <div class="stat-value" id="latestGlucose">--</div>
                    </div>
                </div>

                <div class="card">
                    <h3>Recent Readings</h3>
                    <div id="recentReadings">
                        <div class="loading">Loading...</div>
                    </div>
                </div>
            </div>

            <!-- Glucose Tab -->
            <div id="glucoseTab" class="tab-content">
                <div class="card">
                    <h3>Log New Reading</h3>
                    <div id="glucoseSuccess" class="success hidden">✅ Reading logged successfully!</div>
                    <form onsubmit="logGlucose(event)">
                        <div class="form-group">
                            <label>Glucose Level (mmol/L)</label>
                            <input type="number" id="glucoseValue" step="0.1" min="2" max="25" placeholder="5.5" required>
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="glucoseDate" required>
                        </div>
                        <div class="form-group">
                            <label>Time</label>
                            <input type="time" id="glucoseTime" required>
                        </div>
                        <div class="form-group">
                            <label>Notes (optional)</label>
                            <input type="text" id="glucoseNotes" placeholder="Before breakfast, after exercise, etc.">
                        </div>
                        <button type="submit" class="btn">Log Reading</button>
                    </form>
                </div>
            </div>

            <!-- Profile Tab -->
            <div id="profileTab" class="tab-content">
                <div class="card">
                    <h3>Your Profile</h3>
                    <div class="form-group">
                        <label>Name</label>
                        <div id="profileName" style="padding: 12px; background: white; border-radius: 8px;">--</div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <div id="profileEmail" style="padding: 12px; background: white; border-radius: 8px;">--</div>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <div id="profilePhone" style="padding: 12px; background: white; border-radius: 8px;">--</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let authToken = localStorage.getItem('authToken');
        let currentUser = null;

        // Initialize
        if (authToken) {
            showApp();
            loadUserProfile();
            loadGlucoseData();
        }

        // Auth Functions
        function showSignup() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('loginError').textContent = '';
            document.getElementById('signupError').textContent = '';
        }

        function showLogin() {
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('loginError').textContent = '';
            document.getElementById('signupError').textContent = '';
        }

        async function signup() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const phone = document.getElementById('signupPhone').value;
            const password = document.getElementById('signupPassword').value;
            const errorEl = document.getElementById('signupError');

            if (!name || !email || !password) {
                errorEl.textContent = 'Please fill in all required fields';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorEl.textContent = data.error || 'Signup failed';
                    return;
                }

                authToken = data.token;
                currentUser = data.user;
                localStorage.setItem('authToken', authToken);
                
                showApp();
                loadUserProfile();
                loadGlucoseData();

            } catch (error) {
                errorEl.textContent = 'Connection error. Please try again.';
            }
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            if (!email || !password) {
                errorEl.textContent = 'Please fill in all fields';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorEl.textContent = data.error || 'Login failed';
                    return;
                }

                authToken = data.token;
                currentUser = data.user;
                localStorage.setItem('authToken', authToken);
                
                showApp();
                loadUserProfile();
                loadGlucoseData();

            } catch (error) {
                errorEl.textContent = 'Connection error. Please try again.';
            }
        }

        function logout() {
            localStorage.removeItem('authToken');
            authToken = null;
            currentUser = null;
            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('authSection').classList.remove('hidden');
            showLogin();
        }

        function showApp() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
        }

        // Tab Navigation
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');

            if (tabName === 'profile') {
                displayProfile();
            }
        }

        // User Profile
        async function loadUserProfile() {
            try {
                const response = await fetch(`${API_URL}/api/user/profile`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    
                    const initials = data.user.name.split(' ').map(n => n[0]).join('').toUpperCase();
                    document.getElementById('userAvatar').textContent = initials;
                    document.getElementById('userName').textContent = data.user.name.split(' ')[0];
                }
            } catch (error) {
                console.error('Profile error:', error);
            }
        }

        function displayProfile() {
            if (currentUser) {
                document.getElementById('profileName').textContent = currentUser.name;
                document.getElementById('profileEmail').textContent = currentUser.email;
                document.getElementById('profilePhone').textContent = currentUser.phone || 'Not provided';
            }
        }

        // Glucose Functions
        async function logGlucose(event) {
            event.preventDefault();

            const glucose_level = parseFloat(document.getElementById('glucoseValue').value);
            const date = document.getElementById('glucoseDate').value;
            const time = document.getElementById('glucoseTime').value;
            const notes = document.getElementById('glucoseNotes').value;
            const measured_at = `${date}T${time}:00`;

            try {
                const response = await fetch(`${API_URL}/api/metrics/glucose`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ glucose_level, measured_at, notes })
                });

                if (response.ok) {
                    document.getElementById('glucoseSuccess').classList.remove('hidden');
                    setTimeout(() => {
                        document.getElementById('glucoseSuccess').classList.add('hidden');
                    }, 3000);
                    
                    document.getElementById('glucoseValue').value = '';
                    document.getElementById('glucoseNotes').value = '';
                    
                    loadGlucoseData();
                    showTab('dashboard');
                    document.querySelector('.tab').click();
                } else {
                    alert('Failed to log reading');
                }
            } catch (error) {
                alert('Connection error');
            }
        }

        async function loadGlucoseData() {
            try {
                const response = await fetch(`${API_URL}/api/metrics/glucose`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) return;

                const data = await response.json();
                const readings = data.readings;

                // Update stats
                document.getElementById('totalReadings').textContent = readings.length;

                if (readings.length > 0) {
                    const avg = readings.reduce((sum, r) => sum + parseFloat(r.glucose_level), 0) / readings.length;
                    document.getElementById('avgGlucose').textContent = avg.toFixed(1);
                    document.getElementById('latestGlucose').textContent = readings[0].glucose_level;

                    // Display table
                    const tableHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Date & Time</th>
                                    <th>Level (mmol/L)</th>
                                    <th>Notes</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${readings.slice(0, 10).map(r => {
                                    const date = new Date(r.measured_at);
                                    return `
                                        <tr>
                                            <td>${date.toLocaleDateString()} ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
                                            <td><strong>${r.glucose_level}</strong></td>
                                            <td>${r.notes || '-'}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    `;
                    document.getElementById('recentReadings').innerHTML = tableHTML;
                } else {
                    document.getElementById('recentReadings').innerHTML = '<div class="loading">No readings yet. Log your first reading!</div>';
                }

            } catch (error) {
                console.error('Load glucose error:', error);
            }
        }

        // Set current date/time
        const now = new Date();
        document.getElementById('glucoseDate').value = now.toISOString().split('T')[0];
        document.getElementById('glucoseTime').value = now.toTimeString().split(':').slice(0, 2).join(':');
    </script>
</body>
</html>
