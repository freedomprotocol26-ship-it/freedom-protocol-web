<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Freedom Protocol — User Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f9fb;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0b3c5d;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #0b3c5d;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .metric {
      background: #f1f5f9;
      padding: 15px;
      border-radius: 6px;
    }

    .label {
      font-size: 0.85em;
      color: #555;
    }

    .value {
      font-size: 1.2em;
      font-weight: bold;
      margin-top: 5px;
    }

    .status-good {
      color: #1a7f37;
    }

    .status-warn {
      color: #b45309;
    }

    footer {
      text-align: center;
      font-size: 0.85em;
      color: #666;
      padding: 20px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Freedom Protocol — User Dashboard</h1>
  </header>

  <div class="container">
    <div class="card">
      <h2>Protocol Status</h2>

      <div class="grid">
        <div class="metric">
          <div class="label">Current Phase</div>
          <div class="value" id="phase">—</div>
        </div>

        <div class="metric">
          <div class="label">Day in Phase</div>
          <div class="value" id="day">—</div>
        </div>

        <div class="metric">
          <div class="label">Protocol State</div>
          <div class="value status-good" id="compliance">—</div>
        </div>

        <div class="metric">
          <div class="label">Total Violations</div>
          <div class="value" id="violations">—</div>
        </div>

        <div class="metric">
          <div class="label">Last Violation</div>
          <div class="value" id="lastViolation">—</div>
        </div>

        <div class="metric">
          <div class="label">Consequence</div>
          <div class="value" id="consequence">—</div>
        </div>

        <div class="metric">
          <div class="label">System Decision</div>
          <div class="value" id="decision">—</div>
        </div>

        <div class="metric">
          <div class="label">Notes</div>
          <div class="value" id="notes">—</div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    Freedom Protocol © 2026 — Deterministic Health Engine
  </footer>

  <script>
    async function loadProtocolStatus() {
      try {
        const token = localStorage.getItem('token');

        const response = await fetch('/api/protocol/status', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) {
          throw new Error('Unauthorized or failed request');
        }

        const result = await response.json();
        const data = result.data;

        document.getElementById('phase').textContent =
          `Phase ${data.phase} — ${data.phase === 1 ? 'Reversal' : data.phase === 2 ? 'Stabilization' : 'Maintenance'}`;

        document.getElementById('day').textContent = `Day ${data.dayInPhase}`;
        document.getElementById('compliance').textContent = data.compliant ? 'Compliant' : 'Non-Compliant';
        document.getElementById('violations').textContent = data.totalViolations;
        document.getElementById('lastViolation').textContent = data.lastViolation || 'None';
        document.getElementById('consequence').textContent = data.consequence;
        document.getElementById('decision').textContent = data.systemDecision;
        document.getElementById('notes').textContent = data.notes || '';
      } catch (error) {
        console.error(error);
        alert('Unable to load protocol status. Please log in again.');
      }
    }

    loadProtocolStatus();
  </script>
</body>
</html>
